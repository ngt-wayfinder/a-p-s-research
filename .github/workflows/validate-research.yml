name: Validate research repository
on:
  push:
    branches: [main, repository-restructure]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate repository integrity
        run: python scripts/validate_repository.py
      - name: Compile Python scripts
        run: python -m compileall -q scripts
